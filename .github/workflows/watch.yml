name: Hourly snow watch
on:
  workflow_dispatch:
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check out the data branch
        run: bash pipeline/ci/data_checkout.sh
      - name: Quick exit when no watch is active
        id: gate
        run: |
          python - <<'P' >> "$GITHUB_OUTPUT"
          import json
          try:
              w = json.load(open("data/watch.json"))
              c = json.load(open("data/config.json"))
              total = bool(w.get("active")) and w.get("mode") == "total"
              ondeck = w.get("stage") == "ondeck" and not w.get("active")
              on = (bool(w.get("active")) or ondeck or (bool(c.get("firstSnow")) and w.get("stage") not in (None, "ended"))) and not w.get("test")
              live = bool(w.get("active")) and not w.get("test")
          except Exception:
              on = total = live = False
          print("run=" + ("true" if on else "false"))
          print("live=" + ("true" if live else "false"))
          print("total=" + ("true" if total else "false"))
          P
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r pipeline/requirements.txt
      - name: Radar loop
        if: steps.gate.outputs.live == 'true'
        continue-on-error: true
        run: timeout 540 python pipeline/radar.py data/radar.json
      - name: Snowfall map (season storms only)
        if: steps.gate.outputs.total == 'true'
        continue-on-error: true
        run: timeout 300 python pipeline/snowmap.py data/snowmap.json data/watch.json
      - name: Extra update while a day is on deck (11 AM and 11 PM)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.live != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "$H" = "11" ]; then python pipeline/update.py data --extra --edition midday; fi
          if [ "$H" = "23" ]; then python pipeline/update.py data --extra --edition late; fi
      - if: steps.gate.outputs.run == 'true'
        run: python pipeline/watch_job.py data
      - if: steps.gate.outputs.run == 'true'
        run: bash pipeline/ci/data_commit.sh "Watch $(date -u +%FT%H:%MZ)"
